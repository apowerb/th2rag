name: CLA

# Asks for the CLA signature on a person's first pull request, then leaves them
# alone: one signature covers all their later contributions, in every apowerb
# repository. The signed text is CLA.md in apowerb/apowerb, and signatures are
# stored in that same repository (signatures/cla.json), so a contributor who
# already signed there is not asked again here.
#
# ⚠️ THIS WORKFLOW DOES NOTHING UNTIL THE SECRET EXISTS.
#
# It needs a classic Personal Access Token with the `repo` scope, stored as a
# repository secret named PERSONAL_ACCESS_TOKEN, and able to write to
# apowerb/apowerb. The Actions `GITHUB_TOKEN` is not enough: the action writes
# the signatures file in another repository.
#
# Without the secret the job fails on external pull requests -- visibly, not
# silently, which is the right behaviour: an explicit red beats a CLA everyone
# believes is active.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# pull_request_target runs with the base repository's rights and MUST NOT run
# the pull request's code. This workflow only reads metadata and writes a
# signatures file: it never checks out the contributor's branch. Do not add
# anything here that executes code from the fork.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # `contains`, not `==`: a strict equality silently rejects a signature
      # with a trailing period, different case or an extra space -- the job
      # would be `skipped` and the contributor would see nothing happen. This
      # filter only avoids starting a job for every comment; the action then
      # decides whether the sentence counts as a signature.
      - name: Check the CLA signature
        if: contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          remote-organization-name: 'apowerb'
          remote-repository-name: 'apowerb'
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/apowerb/apowerb/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'dgnaglo,faridovski,bot*'
          custom-notsigned-prcomment: |
            Thank you for this contribution.

            Before it can be merged, we need you to sign the
            [Contributor License Agreement](https://github.com/apowerb/apowerb/blob/main/CLA.md).
            It does not transfer ownership of your code -- you keep the
            copyright -- and it does not change the project's licence.

            To sign, reply to this pull request with exactly:

            ```
            I have read the CLA Document and I hereby sign the CLA
            ```

            One signature covers all your future contributions to apowerb
            repositories.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'CLA signed. Thank you -- the pull request can proceed.'
