[project]
name = "th2rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Imene Boukhelkhal", email = "imene.boukhelkhal@thaink2.com" },
    { name = "David Gnaglo", email = "david.gnaglo@thaink2.com" },
    { name = "Farid Azouaou", email = "farid.azouaou@thaink2.com" }
]
requires-python = ">=3.10"

dependencies = [
    "python-jose[cryptography]",
    # Core FastAPI & Web Server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    # Database & ORM
    "sqlalchemy>=1.4.40,<2.0.0",
    "alembic>=1.15.0",
    "psycopg2-binary>=2.9.10",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.21.0",
    # Authentication & Security
    "pyjwt>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=44.0.0",
    "python-dotenv>=1.0.0",
    # Pydantic & Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "email-validator>=2.2.0",
    # AWS S3
    "boto3>=1.37.0",
    # Vector Database
    "lancedb==0.19",
    "pyarrow==21.0.0",
    # ML & Embeddings
    "sentence-transformers>=3.4.0",
    "transformers>=4.49.0",
    # Document Processing (Docling) - let these control numpy version
    "docling>=2.28.0",
    "docling-core>=2.23.0",
    "docling-ibm-models>=3.4.0",
    "docling-parse>=4.0.0",
    "pypdfium2>=4.30.0",
    # "opencv-python-headless>=4.11.0",
    "pillow>=11.1.0",
    # Scientific Computing - numpy version controlled by docling
    "pandas>=2.2.0",
    # Document Formats
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.2.0",
    # Utilities
    "requests>=2.32.0",
    "rich>=13.9.0",
    "bcrypt==4.3.0",
    "greenlet>=3.3.0",
    "plotly>=6.5.1",
    "litellm>=1.81.6",
    "pypdf2>=3.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "bandit[toml]>=1.7.6",
    "interrogate>=1.5.0",
]

[project.scripts]
th2rag = "th2rag:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"



# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "alembic",
    "data",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/test/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# MyPy configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "test.*"
ignore_errors = true

# Bandit security configuration
[tool.bandit]
exclude_dirs = [
    "test",
    "tests",
    "alembic",
    ".venv",
    "venv",
]
skips = [
    "B101",  # assert_used
    "B601",  # paramiko_calls
]

# Interrogate docstring configuration
[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = true
ignore-module = true
ignore-nested-functions = true
ignore-nested-classes = true
fail-under = 50
exclude = ["test", "tests", "alembic", "data"]
verbose = 1
quiet = false
whitelist-regex = []
color = true
